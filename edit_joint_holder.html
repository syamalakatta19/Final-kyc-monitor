
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Joint Account Holder | KYC Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    
</head>

<body class="kyc-unified-page page-edit-joint-holder dashboard-page edit-holder-page">
{% include "_navigation.html" %}
<div class="kyc-unified-content">



<div class="container-fluid">
    <div class="row">

        <main class="col-12 p-4">

            <div class="mb-4">
                <h3 class="edit-holder-title">Edit Joint Account Holder</h3>
                <p class="text-muted">Update holder and KYC information.</p>
            </div>

            <div class="edit-holder-card">

                <form method="POST"
                      action="{{ url_for('edit_joint_holder', holder_id=holder.holder_id) }}">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Account Number</label>
                            <input type="text" name="account_number"
                                   class="form-control" required
                                   value="{{ holder.account_number }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Holder Name</label>
                            <input type="text" name="holder_name"
                                   class="form-control" required
                                   value="{{ holder.holder_name }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="text" name="dob"
                                   class="form-control" required
                                   value="{{ holder.dob.strftime('%Y-%m-%d') if holder.dob else '' }}" placeholder="YYYY-MM-DD, DD-MM-YYYY, or MM/DD/YYYY">
<small class="form-text">DOB formats: YYYY-MM-DD, DD-MM-YYYY, MM/DD/YYYY.</small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone"
                                   class="form-control" required
                                   pattern="[0-9]{10}" maxlength="10"
                                   value="{{ holder.phone }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email"
                                   class="form-control"
                                   value="{{ holder.email or '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">KYC Document</label>
                            <select name="kyc_document" class="form-select" required>
                                <option value="">Select Document</option>
                                {% for doc in ['Aadhaar', 'PAN', 'Passport', 'Voter ID', 'Driving Licence'] %}
                                <option value="{{ doc }}"
                                    {% if holder.kyc_document == doc %}selected{% endif %}>
                                    {{ doc }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">KYC Issue Date</label>
                            <input type="date" name="kyc_issue_date"
                                   class="form-control" required
                                   value="{{ holder.kyc_issue_date.strftime('%Y-%m-%d') if holder.kyc_issue_date else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">KYC Expiry Date</label>
                            <input type="date" name="kyc_expiry_date"
                                   class="form-control" required
                                   value="{{ holder.kyc_expiry_date.strftime('%Y-%m-%d') if holder.kyc_expiry_date else '' }}">
                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            Update Holder
                        </button>

                        <a href="{{ url_for('joint_holders') }}"
                           class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div><!-- /.kyc-unified-content -->
</body>
</html>
