{# Single source of truth for authenticated navigation. #}
<aside class="sidebar kyc-global-sidebar" aria-label="Main navigation">
  <div class="brand"><div class="brand-icon"><i class="bi bi-shield-check"></i></div>
    <div>KYC MONITOR<small>BANKING COMPLIANCE</small></div></div>
  <div class="nav-heading">Main Menu</div>
  <a href="{{ url_for('dashboard') }}" class="sidebar-link{% if request.endpoint == 'dashboard' %} active{% endif %}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
  <a href="{{ url_for('customers') }}" class="sidebar-link{% if request.endpoint in ('customers','add_customer','edit_customer','view_customer') %} active{% endif %}"><i class="bi bi-people"></i> Customers</a>
  <a href="{{ url_for('branches') }}" class="sidebar-link{% if request.endpoint in ('branches','add_branch','edit_branch') %} active{% endif %}"><i class="bi bi-building"></i> Branch Management</a>
  <a href="{{ url_for('joint_holders') }}" class="sidebar-link{% if request.endpoint in ('joint_holders','add_joint_holder','edit_joint_holder','schedule_joint_holder') %} active{% endif %}"><i class="bi bi-people-fill"></i> Joint Account Holders</a>
  <div class="nav-heading">Re-KYC Management</div>
  <a href="{{ url_for('view_rekyc_schedules') }}" class="sidebar-link{% if request.endpoint in ('view_rekyc_schedules','schedule_rekyc','edit_rekyc_schedule','complete_rekyc_schedule','complete_joint_holder_rekyc') %} active{% endif %}"><i class="bi bi-calendar-check"></i> Re-KYC Schedules</a>
  <div class="nav-heading">Reports</div>
  <a href="{{ url_for('monthly_kyc_report') }}" class="sidebar-link{% if request.endpoint == 'monthly_kyc_report' %} active{% endif %}"><i class="bi bi-bar-chart-line"></i> Monthly Reports</a>
  <a href="{{ url_for('branch_wise_report') }}" class="sidebar-link{% if request.endpoint == 'branch_wise_report' %} active{% endif %}"><i class="bi bi-buildings"></i> Branch-wise Reports</a>
  <div class="nav-heading">Account</div>
  <a href="{{ url_for('logout') }}" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
</aside>
